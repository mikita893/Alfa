<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha — logowanie organizatorów</title><link rel="stylesheet" href="/style.css"><script type="module" src="/auth-client.js"></script></head><body class="login-body"><main class="login-card"><div class="login-brand">α <strong>alpha</strong></div><span class="eyebrow">PRZESTRZEŃ ORGANIZATORÓW</span><h1>Dobrze, że jesteś.</h1><p>Zaloguj się, aby przejść do uczestników i edycji.</p><form id="login-form"><label class="field"><span>Login</span><input name="login" autocomplete="username" required maxlength="120" autofocus></label><label class="field"><span>Hasło</span><input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="login-error" role="alert"></p><button class="button primary" type="submit">Zaloguj się</button></form><p class="form-note">Dostęp wyłącznie na zaproszenie. Aby otrzymać konto lub odzyskać dostęp, skontaktuj się z administratorem organizatorów.</p></main></body></html>
